# Spring Boot application properties for tests
# Usa PostgreSQL si está configurado vía variables de entorno; de lo contrario recurre a H2 en memoria
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-test.sql
spring.main.allow-bean-definition-overriding=true

# JWT and other custom properties for tests
app.jwt.secret=${APP_JWT_SECRET:test-only-jwt-secret-do-not-use-in-production-min64chars-abcdef1234567890}
