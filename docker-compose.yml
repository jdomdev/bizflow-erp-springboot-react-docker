services:
  erp-prod-db-container:
    profiles: ["prod"]
    image: postgres:16-alpine
    container_name: erp-prod-db-container
    environment:
      POSTGRES_DB: erp_prod_db
      POSTGRES_USER: erp_prod_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./sql/01_init_prod.sql:/docker-entrypoint-initdb.d/01_init_prod.sql:ro
      - ./sql/common:/docker-entrypoint-initdb.d/common:ro
      - ./sql/dev_prod:/docker-entrypoint-initdb.d/dev_prod:ro
      - ./sql/prod:/docker-entrypoint-initdb.d/prod:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U erp_prod_user" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      bizflow_erp_network:
        aliases:
          - prod-db
    restart: unless-stopped

  erp-dev-db-container:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: erp-dev-db-container
    environment:
      POSTGRES_DB: erp_dev_db
      POSTGRES_USER: erp_dev_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./sql/01_init_dev.sql:/docker-entrypoint-initdb.d/01_init_dev.sql:ro
      - ./sql/common:/docker-entrypoint-initdb.d/common:ro
      - ./sql/dev_prod:/docker-entrypoint-initdb.d/dev_prod:ro
      - ./sql/dev:/docker-entrypoint-initdb.d/dev:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U erp_dev_user" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      bizflow_erp_network:
        aliases:
          - dev-db
    restart: unless-stopped

  erp-test-db-container:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: erp-test-db-container
    environment:
      POSTGRES_DB: erp_test_db
      POSTGRES_USER: erp_test_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./sql/01_init_test.sql:/docker-entrypoint-initdb.d/01_init_test.sql:ro
      - ./sql/common:/docker-entrypoint-initdb.d/common:ro
      - ./sql/dev_prod:/docker-entrypoint-initdb.d/dev_prod:ro
      - ./sql/test:/docker-entrypoint-initdb.d/test:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U erp_test_user -d erp_test_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      bizflow_erp_network:
        aliases:
          - test-db
    restart: unless-stopped

  # pgAdmin - PostgreSQL GUI (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bizflowerp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - erp-prod-db-container
      - erp-dev-db-container
      - erp-test-db-container
    networks:
      bizflow_erp_network:
        aliases:
          - pgadmin
    restart: unless-stopped
    profiles:
      - debug


  backend-prod:
    profiles: ["prod"]
    image: bizflow-erp-springboot-react-docker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-prod-container
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8181:8080"
    depends_on:
      erp-prod-db-container:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      bizflow_erp_network:
          aliases:
            - backend
            - backend-prod
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  backend-dev:
    profiles: ["dev"]
    image: bizflow-erp-springboot-react-docker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-dev-container
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8082:8080"
    depends_on:
      erp-dev-db-container:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      bizflow_erp_network:
          aliases:
            - backend
            - backend-dev
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  backend-test:
    profiles: ["test"]
    image: bizflow-erp-springboot-react-docker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend-test-container
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8083:8080"
    depends_on:
      erp-test-db-container:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      bizflow_erp_network:
          aliases:
            - backend
            - backend-test
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  seed-expense-users-prod:
    profiles: ["prod"]
    image: alpine:3.19
    container_name: erp-seed-expense-users-prod
    depends_on:
      backend-prod:
        condition: service_healthy
    environment:
      API_URL: http://backend-prod:8080/api/v1/auth/signup
      REGISTER_USERS_SEED_FILE: ${REGISTER_USERS_SEED_FILE:-}
    volumes:
      - ./scripts:/workspace/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash curl >/dev/null 2>&1
        if [ -n "${REGISTER_USERS_SEED_FILE}" ] || [ -f /workspace/scripts/secrets/register_users_payloads.jsonl ]; then
          bash /workspace/scripts/register_users.sh
        else
          echo "REGISTER_USERS_SEED_FILE no definido y no existe scripts/secrets/register_users_payloads.jsonl; se omite el sembrado de usuarios."
        fi
    networks:
      - bizflow_erp_network
    restart: "no"

  seed-expense-users-dev:
    profiles: ["dev"]
    image: alpine:3.19
    container_name: erp-seed-expense-users-dev
    depends_on:
      backend-dev:
        condition: service_healthy
    environment:
      API_URL: http://backend-dev:8080/api/v1/auth/signup
      REGISTER_USERS_SEED_FILE: ${REGISTER_USERS_SEED_FILE:-}
    volumes:
      - ./scripts:/workspace/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash curl >/dev/null 2>&1
        if [ -n "${REGISTER_USERS_SEED_FILE}" ] || [ -f /workspace/scripts/secrets/register_users_payloads.jsonl ]; then
          bash /workspace/scripts/register_users.sh
        else
          echo "REGISTER_USERS_SEED_FILE no definido y no existe scripts/secrets/register_users_payloads.jsonl; se omite el sembrado de usuarios."
        fi
    networks:
      - bizflow_erp_network
    restart: "no"

  seed-expense-users-test:
    profiles: ["test"]
    image: alpine:3.19
    container_name: erp-seed-expense-users-test
    depends_on:
      backend-test:
        condition: service_healthy
    environment:
      API_URL: http://backend-test:8080/api/v1/auth/signup
      REGISTER_USERS_SEED_FILE: ${REGISTER_USERS_SEED_FILE:-}
    volumes:
      - ./scripts:/workspace/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash curl >/dev/null 2>&1
        if [ -n "${REGISTER_USERS_SEED_FILE}" ] || [ -f /workspace/scripts/secrets/register_users_payloads.jsonl ]; then
          bash /workspace/scripts/register_users.sh
        else
          echo "REGISTER_USERS_SEED_FILE no definido y no existe scripts/secrets/register_users_payloads.jsonl; se omite el sembrado de usuarios."
        fi
    networks:
      - bizflow_erp_network
    restart: "no"


  # React Frontend (single container, configurable API URL)


  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8081/api/v1
    container_name: erp-frontend-prod-container
    environment:
      VITE_API_URL: http://localhost:8081/api/v1
    ports:
      - "8080:80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bizflow_erp_network
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8082/api/v1
    container_name: erp-frontend-dev-container
    environment:
      VITE_API_URL: http://localhost:8082/api/v1
    ports:
      - "8085:80"
    depends_on:
      - ${FRONTEND_DEPENDS_ON}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bizflow_erp_network
    restart: unless-stopped

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8083/api/v1
    container_name: erp-frontend-test-container
    environment:
      VITE_API_URL: http://localhost:8083/api/v1
    ports:
      - "8086:80"
    depends_on:
      - ${FRONTEND_DEPENDS_ON}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bizflow_erp_network
    restart: unless-stopped


volumes:
  postgres_prod_data:
    driver: local
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local

networks:
  bizflow_erp_network:
    driver: bridge
