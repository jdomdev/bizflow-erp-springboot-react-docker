name: Build & Test - Frontend (React)

on:
  push:
    branches: [ main, dev, fix/*, feature/* ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - '.github/workflows/frontend-build-test.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - '.github/workflows/frontend-build-test.yml'

jobs:
  build:
    name: Build and Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.x']  # Solo 18.x temporalmente

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Display Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm run test:ci || echo "Tests not configured yet"
        continue-on-error: true

      - name: Run Sanity Suite
        run: npm run test:sanity || echo "Sanity tests not configured yet"
        continue-on-error: true

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 7

      - name: Archive test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 7
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated
        continue-on-error: true

      - name: Run Snyk security scan
        run: |
          npm install -g snyk
          snyk test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
