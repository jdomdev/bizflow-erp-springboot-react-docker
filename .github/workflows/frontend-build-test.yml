name: Build & Test - Frontend (React)

on:
  push:
    branches: [ main, dev, fix/*, feature/* ]
    paths:
      - 'frontend/**'
      - 'package.json'
      - '.github/workflows/frontend-build-test.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18.x']  # Solo 18.x temporalmente
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Display Node version
        run: node --version && npm --version
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true
      
      - name: Build
        run: |
          cd frontend
          npm run build
    
      # ✅ CORRECCIÓN: Eliminar --watchAll=false
      - name: Run Tests
        run: |
          cd frontend
          npm run test:ci || echo "⚠️ Tests not configured yet"
        continue-on-error: true  # Temporal hasta que se implementen tests
      
      # ✅ CORRECCIÓN:  Script sanity también debe ser compatible
      - name: Run Sanity Suite
        run: |
          cd frontend
          npm run test:sanity || echo "⚠️ Sanity tests not configured yet"
        continue-on-error: true

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist/

      - name: Archive test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.node-version }}
          path: frontend/coverage/
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'  # Cambiado de 20.x a 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run Snyk security scan
        run: |
          cd frontend
          npm install -g snyk
          snyk test --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true