name: Build & Test - Backend (Maven)

on:
  push:
    branches: [ main, dev, fix/*, feature/* ]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-build-test.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test_db
          POSTGRES_USER: erp_test_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: Build and Test (unit + integration)
        run: ./mvnw -B -ntp clean verify
        working-directory: backend
        env:
          MAVEN_OPTS: "-Xmx1024m"
          DB_HOST: localhost

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: build/backend/surefire-reports/

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/backend/site/jacoco/

  sonarqube:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare Maven Wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B -ntp clean verify sonar:sonar \
            -Dsonar.projectKey=BizflowERP \
            -Dsonar.sources=src/main \
            -Dsonar.exclusions='src/test/**'
        working-directory: backend
        if: env.SONAR_TOKEN != ''
